AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Task management system - DynamoDB tables (Tasks / TaskClients / TaskSeries / TaskFrames) only.
  The Lambda (MCP server) is deployed separately via template.yaml.

Resources:

  # ------------------------------------------------------------------
  # 1. Tasks table (actual task records: one item per Client x Series x Frame)
  # ------------------------------------------------------------------
  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Tasks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: clientCode
          AttributeType: S
        - AttributeName: taskKey
          AttributeType: S
      KeySchema:
        - AttributeName: clientCode
          KeyType: HASH
        - AttributeName: taskKey
          KeyType: RANGE

  # ------------------------------------------------------------------
  # 2. Clients table (client master)
  # ------------------------------------------------------------------
  ClientsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TaskClients
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: lookupBucket
          AttributeType: S
        - AttributeName: clientCode
          AttributeType: S
      KeySchema:
        - AttributeName: lookupBucket
          KeyType: HASH
        - AttributeName: clientCode
          KeyType: RANGE

  # ------------------------------------------------------------------
  # 3. Series table (series master, e.g. document types like "document receipt")
  # ------------------------------------------------------------------
  SeriesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TaskSeries
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: lookupBucket
          AttributeType: S
        - AttributeName: seriesCode
          AttributeType: S
      KeySchema:
        - AttributeName: lookupBucket
          KeyType: HASH
        - AttributeName: seriesCode
          KeyType: RANGE

  # ------------------------------------------------------------------
  # 4. Frames table (time-frame master, e.g. "202606")
  # ------------------------------------------------------------------
  FramesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TaskFrames
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: lookupBucket
          AttributeType: S
        - AttributeName: frameCode
          AttributeType: S
      KeySchema:
        - AttributeName: lookupBucket
          KeyType: HASH
        - AttributeName: frameCode
          KeyType: RANGE

  # ------------------------------------------------------------------
  # 5. History table (client task history log; one item per history entry)
  # ------------------------------------------------------------------
  HistoryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TaskHistory
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: clientCode
          AttributeType: S
        - AttributeName: historyId
          AttributeType: S
      KeySchema:
        - AttributeName: clientCode
          KeyType: HASH
        - AttributeName: historyId
          KeyType: RANGE

  # ------------------------------------------------------------------
  # 6. Agent jobs table (async agent-dispatch job records; one item per job)
  # ------------------------------------------------------------------
  AgentJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TaskAgentJobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: clientCode
          AttributeType: S
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: clientCode
          KeyType: HASH
        - AttributeName: jobId
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ------------------------------------------------------------------
  # 7. Classification rules table (single-table design: lookupBucket="AXIS"
  #    holds axis definitions, lookupBucket="RULE#<axisId>" holds the rules
  #    belonging to that axis; sortKey holds axisId or ruleId respectively)
  # ------------------------------------------------------------------
  ClassificationRulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: TaskClassificationRules
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: lookupBucket
          AttributeType: S
        - AttributeName: sortKey
          AttributeType: S
      KeySchema:
        - AttributeName: lookupBucket
          KeyType: HASH
        - AttributeName: sortKey
          KeyType: RANGE

Outputs:
  TasksTableName:
    Value: !Ref TasksTable
  TasksTableArn:
    Value: !GetAtt TasksTable.Arn
  ClientsTableName:
    Value: !Ref ClientsTable
  ClientsTableArn:
    Value: !GetAtt ClientsTable.Arn
  SeriesTableName:
    Value: !Ref SeriesTable
  SeriesTableArn:
    Value: !GetAtt SeriesTable.Arn
  FramesTableName:
    Value: !Ref FramesTable
  FramesTableArn:
    Value: !GetAtt FramesTable.Arn
  HistoryTableName:
    Value: !Ref HistoryTable
  HistoryTableArn:
    Value: !GetAtt HistoryTable.Arn
  AgentJobsTableName:
    Value: !Ref AgentJobsTable
  AgentJobsTableArn:
    Value: !GetAtt AgentJobsTable.Arn
  ClassificationRulesTableName:
    Value: !Ref ClassificationRulesTable
  ClassificationRulesTableArn:
    Value: !GetAtt ClassificationRulesTable.Arn

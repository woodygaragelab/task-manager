AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Task management system - FastMCP Lambda (Streamable HTTP) + Web API (Cognito-authenticated).
  DynamoDB tables (Tasks/TaskClients/TaskSeries/TaskFrames/TaskHistory) are deployed separately via
  tables.yaml and referenced here by their fixed table names.

Parameters:
  McpAuthToken:
    Type: String
    NoEcho: true
    Description: >
      Shared secret token for the MCP server. Claude Desktop/Code must send this as
      "Authorization: Bearer <token>" on every request.
  AgentRuntimeArn:
    Type: String
    Default: "arn:aws:bedrock-agentcore:ap-northeast-1:155830630328:runtime/task_agent-lAAoax7UkB"
    Description: >
      Bedrock AgentCore runtime ARN for the receipt-classification ("分類") agent
      (task-agent/, formerly agentmanager/receipt-agent), invoked asynchronously
      by TaskAgentJobProcessorFunction.

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.13

Resources:

  # ------------------------------------------------------------------
  # Shared Lambda Layer: task_repository (DynamoDB CRUD logic).
  # Used by both the MCP server and the Web API Lambda.
  # ------------------------------------------------------------------
  TaskRepositoryLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: task-repository
      ContentUri: layer/
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Delete

  # ------------------------------------------------------------------
  # FastMCP Lambda (Streamable HTTP, stateless_http=True)
  # Function URL has AuthType: NONE; auth is enforced inside app.py
  # via a Bearer-token check (Claude Desktop) OR Anthropic's published
  # outbound IP range (claude.ai / mobile custom connectors).
  # ------------------------------------------------------------------
  TaskMcpFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: taskmanager-mcp
      CodeUri: mcp_src/
      Handler: app.handler
      Layers:
        - !Ref TaskRepositoryLayer
      Environment:
        Variables:
          TASKS_TABLE: Tasks
          CLIENTS_TABLE: TaskClients
          SERIES_TABLE: TaskSeries
          FRAMES_TABLE: TaskFrames
          HISTORY_TABLE: TaskHistory
          AGENT_JOBS_TABLE: TaskAgentJobs
          CLASSIFICATION_RULES_TABLE: TaskClassificationRules
          MCP_AUTH_TOKEN: !Ref McpAuthToken
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Tasks
        - DynamoDBCrudPolicy:
            TableName: TaskClients
        - DynamoDBCrudPolicy:
            TableName: TaskSeries
        - DynamoDBCrudPolicy:
            TableName: TaskFrames
        - DynamoDBCrudPolicy:
            TableName: TaskHistory
        - DynamoDBCrudPolicy:
            TableName: TaskAgentJobs
        - DynamoDBCrudPolicy:
            TableName: TaskClassificationRules
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

  # ------------------------------------------------------------------
  # Cognito User Pool (internal staff accounts only; self sign-up disabled)
  # ------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: taskmanager-users
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: taskmanager-webapp
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH

  # ------------------------------------------------------------------
  # HTTP API (API Gateway v2) with Cognito JWT Authorizer
  # ------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          CognitoAuth:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
            IdentitySource: "$request.header.Authorization"
        DefaultAuthorizer: CognitoAuth
      CorsConfiguration:
        AllowOrigins:
          - "*"   # In production, narrow this to the Amplify Hosting domain only
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS

  # ------------------------------------------------------------------
  # Web API Lambda (internal web app backend, Cognito auth required)
  # ------------------------------------------------------------------
  TaskApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: taskmanager-api
      CodeUri: api_src/
      Handler: app.handler
      Layers:
        - !Ref TaskRepositoryLayer
      Environment:
        Variables:
          TASKS_TABLE: Tasks
          CLIENTS_TABLE: TaskClients
          SERIES_TABLE: TaskSeries
          FRAMES_TABLE: TaskFrames
          HISTORY_TABLE: TaskHistory
          AGENT_JOBS_TABLE: TaskAgentJobs
          CLASSIFICATION_RULES_TABLE: TaskClassificationRules
          AGENT_JOB_PROCESSOR_FUNCTION_NAME: !Ref TaskAgentJobProcessorFunction
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Tasks
        - DynamoDBCrudPolicy:
            TableName: TaskClients
        - DynamoDBCrudPolicy:
            TableName: TaskSeries
        - DynamoDBCrudPolicy:
            TableName: TaskFrames
        - DynamoDBCrudPolicy:
            TableName: TaskHistory
        - DynamoDBCrudPolicy:
            TableName: TaskAgentJobs
        - DynamoDBCrudPolicy:
            TableName: TaskClassificationRules
        - LambdaInvokePolicy:
            FunctionName: !Ref TaskAgentJobProcessorFunction
      Events:
        ListClients:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clients
            Method: get
        CreateClient:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clients
            Method: post
        UpdateClient:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clients/{clientCode}
            Method: patch
        DeleteClient:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clients/{clientCode}
            Method: delete
        SubmitAgentJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clients/{clientCode}/agent-jobs
            Method: post
        GetAgentJob:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clients/{clientCode}/agent-jobs/{jobId}
            Method: get
        ListSeries:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /series
            Method: get
        CreateSeries:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /series
            Method: post
        DeleteSeries:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /series/{seriesCode}
            Method: delete
        ListFrames:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /frames
            Method: get
        CreateFrame:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /frames
            Method: post
        DeleteFrame:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /frames/{frameCode}
            Method: delete
        ListTasksByClient:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clients/{clientCode}/tasks
            Method: get
        GetTask:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks/{clientCode}/{seriesCode}/{frameCode}
            Method: get
        CreateTask:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks
            Method: post
        UpdateTask:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks/{clientCode}/{seriesCode}/{frameCode}
            Method: patch
        DeleteTask:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /tasks/{clientCode}/{seriesCode}/{frameCode}
            Method: delete
        GetHistory:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clients/{clientCode}/history
            Method: get
        CreateHistoryEntry:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clients/{clientCode}/history
            Method: post
        UpdateHistoryEntry:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clients/{clientCode}/history/{historyId}
            Method: patch
        DeleteHistoryEntry:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /clients/{clientCode}/history/{historyId}
            Method: delete
        ListClassificationAxes:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /classification-axes
            Method: get
        CreateClassificationAxis:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /classification-axes
            Method: post
        UpdateClassificationAxis:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /classification-axes/{axisId}
            Method: patch
        DeleteClassificationAxis:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /classification-axes/{axisId}
            Method: delete
        ListClassificationRules:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /classification-axes/{axisId}/rules
            Method: get
        CreateClassificationRule:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /classification-axes/{axisId}/rules
            Method: post
        UpdateClassificationRule:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /classification-axes/{axisId}/rules/{ruleId}
            Method: patch
        DeleteClassificationRule:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /classification-axes/{axisId}/rules/{ruleId}
            Method: delete
        Classify:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /classify
            Method: post

  # ------------------------------------------------------------------
  # Agent job processor (async; invoked directly by TaskApiFunction via
  # Lambda's Event invocation type, not sitting behind API Gateway, so it
  # can run far longer than API Gateway's 30s limit).
  # ------------------------------------------------------------------
  TaskAgentJobProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: taskmanager-agent-job-processor
      CodeUri: agent_job_src/
      Handler: app.handler
      Timeout: 900
      Layers:
        - !Ref TaskRepositoryLayer
      Environment:
        Variables:
          TASKS_TABLE: Tasks
          CLIENTS_TABLE: TaskClients
          SERIES_TABLE: TaskSeries
          FRAMES_TABLE: TaskFrames
          HISTORY_TABLE: TaskHistory
          AGENT_JOBS_TABLE: TaskAgentJobs
          CLASSIFICATION_RULES_TABLE: TaskClassificationRules
          AGENT_RUNTIME_ARN: !Ref AgentRuntimeArn
      Policies:
        - DynamoDBCrudPolicy:
            TableName: Tasks
        - DynamoDBCrudPolicy:
            TableName: TaskClients
        - DynamoDBCrudPolicy:
            TableName: TaskSeries
        - DynamoDBCrudPolicy:
            TableName: TaskFrames
        - DynamoDBCrudPolicy:
            TableName: TaskHistory
        - DynamoDBCrudPolicy:
            TableName: TaskAgentJobs
        - DynamoDBCrudPolicy:
            TableName: TaskClassificationRules
        - Statement:
            - Effect: Allow
              Action: bedrock-agentcore:InvokeAgentRuntime
              # InvokeAgentRuntimeの実際の認可チェックはruntime-endpoint配下のARNに対して
              # 行われるため、ベースのruntime ARNだけでは不足する(AccessDeniedExceptionになる)。
              Resource:
                - !Ref AgentRuntimeArn
                - !Sub "${AgentRuntimeArn}/runtime-endpoint/*"

Outputs:
  TaskMcpFunctionUrl:
    Description: "MCP server endpoint URL (register in Claude Desktop/Code mcp config)"
    Value: !GetAtt TaskMcpFunctionUrl.FunctionUrl
  WebApiEndpoint:
    Description: "Web API base URL (for the frontend app)"
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Description: "Cognito User Pool ID (for admin user creation and Amplify config)"
    Value: !Ref UserPool
  UserPoolClientId:
    Description: "Cognito User Pool Client ID (for Amplify config)"
    Value: !Ref UserPoolClient
